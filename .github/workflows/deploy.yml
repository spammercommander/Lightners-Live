name: "Export and Deploy to GitHub Pages"
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Export Game
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Godot Headless & Setup Templates
        run: |
          # Download and install Godot 3.5.3 Headless
          wget https://github.com
          unzip Godot_v3.5.3-stable_linux_headless.64.zip
          mv Godot_v3.5.3-stable_linux_headless.64 /usr/local/bin/godot
          
          # Force structure the export requirements manually
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          wget https://github.com
          unzip Godot_v3.5.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/templates/3.5.3.stable/
          
          # Force create standard config preset maps
          echo -e '[preset.0]\nname="Web"\nplatform="HTML5"\nrunnable=true\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/web/index.html"\nscript_export_mode=1\nscript_encryption_key=""\n[preset.0.options]' > export_presets.cfg

      - name: Build Web Application
        run: |
          mkdir -p build/web
          godot --no-window --export "Web" build/web/index.html

      - name: Deploy Build to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
