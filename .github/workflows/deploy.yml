name: "Export and Deploy to GitHub Pages"
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Export Game
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Missing Export Preset
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo -e "[preset.0]\nname=\"HTML5\"\nplatform=\"HTML5\"\nrunnable=true\nexport_filter=\"all_resources\"\n[preset.0.options]" > export_presets.cfg
          fi

      - name: Export Godot Project to HTML5
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com
          export_preset_name: HTML5
          project_file_path: project.godot

      - name: Deploy Build to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
